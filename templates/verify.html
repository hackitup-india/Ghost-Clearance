<!DOCTYPE html>
<html>
<head>
    <title>OTP Verification</title>
    <style>
        body {
            background: #020617;
            color: white;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: #0f172a;
            padding: 30px;
            border-radius: 10px;
            width: 320px;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #22c55e;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #16a34a;
        }

        .error {
            color: #f87171;
            text-align: center;
        }

        .hint {
            margin-top: 15px;
            font-size: 12px;
            color: #64748b;
            text-align: center;
        }

        .email {
            font-size: 13px;
            text-align: center;
            color: #94a3b8;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Verify OTP</h2>

    <p class="email">OTP sent to: {{ email }}</p>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="otp" placeholder="Enter 6-digit OTP" required>
        <button type="submit">Verify</button>
    </form>

    <!-- 😈 subtle CTF hint -->
    <p class="hint">
        Didn’t receive the code? Maybe it's already somewhere...
    </p>
</div>


</body>
</html>
